name: Update Inflation Dashboard

on:
  workflow_dispatch:

jobs:
  check_date:
    runs-on: ubuntu-latest
    outputs:
      should_run: ${{ steps.date_check.outputs.run_pipeline }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Check against INEGI calendar
        id: date_check
        run: |
          # Force the timezone to match INEGI's location
          TODAY=$(TZ='America/Mexico_City' date +'%Y-%m-%d')
          echo "Today is $TODAY in Mexico City."
          
          if grep -Fxq "$TODAY" fechas_inegi.txt; then
            echo "run_pipeline=true" >> "$GITHUB_OUTPUT"
            echo "Match found! The pipeline will run today."
          else
            echo "run_pipeline=false" >> "$GITHUB_OUTPUT"
            echo "Not a publication date. Pipeline skipped."
          fi

  run_pipeline:
    needs: check_date
    if: needs.check_date.outputs.should_run == 'true'
    runs-on: ubuntu-22.04
    timeout-minutes: 20
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Install Playwright OS dependencies
        timeout-minutes: 5
        run: sudo env "PATH=$PATH" python -m playwright install-deps chromium

      - name: Install Playwright Chromium browser
        run: python -m playwright install chromium

      - name: Start Streamlit Dashboard in background
        run: |
          # 1. Evitar el prompt interactivo de correo electrónico de Streamlit en CI
          mkdir -p ~/.streamlit
          echo -e "[general]\nemail = \"\"" > ~/.streamlit/credentials.toml

          # 2. Iniciar Streamlit en segundo plano
          python -m streamlit run resumen.py --server.port 8501 --server.headless true > streamlit.log 2>&1 &
          
          # 3. Esperar a que el servidor responda (hasta 60 segundos)
          echo "⏳ Esperando a que Streamlit esté listo..."
          for i in {1..30}; do
            if curl -s -o /dev/null -w "%{http_code}" http://localhost:8501 | grep -q "200"; then
              echo "✅ Streamlit está corriendo en el puerto 8501"
              exit 0
            fi
            sleep 2
          done
          
          echo "❌ Streamlit no logró iniciar en 60 segundos. Revisa el log:"
          cat streamlit.log
          exit 1
      # 👆 FIN DEL NUEVO PASO 👆

      - name: Run Pipeline
        env:
          GREEN_API_INSTANCE: ${{ secrets.GREEN_API_INSTANCE }}
          GREEN_API_TOKEN: ${{ secrets.GREEN_API_TOKEN }}
          WHATSAPP_GROUP_ID: ${{ secrets.WHATSAPP_GROUP_ID }}
        run: python scripts/main_pipeline.py

      - name: Commit updated data
        run: |
          TODAY=$(TZ='America/Mexico_City' date +'%Y-%m-%d')
          git config --global user.name 'GitHub Actions'
          git config --global user.email 'actions@github.com'
          git add data/intermediate/
          git commit -m "Update intermediate data for $TODAY" || echo "No changes to commit"
          git push